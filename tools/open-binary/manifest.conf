# shellcheck shell=bash
# Sourced by lib/manifest.sh. Shell key-value, not TOML. See lib/manifest.sh for the
# format and for why it is not TOML.

TOOL_NAME="open-binary"
TOOL_TITLE="Clickable binary file links in the Claude Code VS Code chat panel."
TOOL_AGENT_LABEL="io.github.dthinkr.ccw.open-binary"

TOOL_TOUCHES=(
"patch|$HOME/.vscode{,-insiders}/extensions/anthropic.claude-code-*/extension.js|Patched in place, once per installed version. About 522 bytes go in, 662 with the click log on.|cp extension.js.ccw-open-binary.bak extension.js"
"backup|$HOME/.vscode{,-insiders}/extensions/anthropic.claude-code-*/extension.js.ccw-open-binary.bak|The pristine bundle, copied before the first write for that version. Fixed name because rollback and the version migration both read it back.|rm it after restoring"
"agent|$HOME/Library/LaunchAgents/io.github.dthinkr.ccw.open-binary.plist|launchd agent. WatchPaths on ~/.vscode/extensions and ~/.vscode-insiders/extensions, so it re-applies the patch after every extension upgrade.|launchctl bootout gui/\$(id -u)/io.github.dthinkr.ccw.open-binary && rm -f the plist"
"state|$HOME/.local/state/ccw/open-binary|patch.log (one line per run per version), runtime.log (one line per click, off unless you installed with --click-log), and the agent's stderr.|rm -rf it"
)
