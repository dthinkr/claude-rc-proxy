# shellcheck shell=bash
# Sourced by lib/manifest.sh. Shell key-value, not TOML. See lib/manifest.sh for the
# format and for why it is not TOML.
#
# CCW_ROOT is exported by cc-kit and by each tool script, so the build artifact is
# declared at its real absolute path rather than a relative one.

TOOL_NAME="rc-proxy"
TOOL_TITLE="Send inference to a local gateway without losing any first-party Claude Code feature."
TOOL_AGENT_LABEL="io.github.dthinkr.ccw.rc-proxy"

TOOL_TOUCHES=(
"build|${CCW_ROOT:-.}/tools/rc-proxy/claude-rc-proxy|The binary, built here by go build. Gitignored. Never a Release download: an unsigned Mach-O trips Gatekeeper and produces one identical issue per user.|rm it"
"agent|$HOME/Library/LaunchAgents/io.github.dthinkr.ccw.rc-proxy.plist|launchd agent, KeepAlive. Reads your token from the config file at start, so the token never goes into the plist, which is world readable.|launchctl bootout gui/\$(id -u)/io.github.dthinkr.ccw.rc-proxy && rm -f the plist"
"state|$HOME/.local/state/ccw/rc-proxy|route.log (startup, model injections, errors; rotated to route.log.1 past 8 MiB) and pool-models.json (model ids seen in the last 7 days).|rm -rf it"
"config|$HOME/.config/ccw/rc-proxy.token|Your gateway token, mode 600. You write this file, the installer only reads it.|rm it"
"setting|$HOME/.claude/settings.json|Four env keys: https_proxy, http_proxy, no_proxy, NODE_EXTRA_CA_CERTS. The installer prints them for you to paste and never edits this file itself.|delete those four keys from the env object by hand"
)
