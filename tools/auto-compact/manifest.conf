# shellcheck shell=bash
# Sourced by lib/manifest.sh. Shell key-value, not TOML. See lib/manifest.sh for the
# format and for why it is not TOML.

TOOL_NAME="auto-compact"
TOOL_TITLE="Compact an idle Claude Code session while its prompt cache is still warm."
TOOL_AGENT_LABEL="io.github.dthinkr.ccw.auto-compact"

TOOL_TOUCHES=(
"setting|$HOME/Library/Application Support/Code/User/settings.json|One key added: claudeCode.claudeProcessWrapper, pointing at shim/cc-stdin-shim in this checkout. Backed up first. Insiders has its own copy of this file and gets the same key.|remove that one key, or run ./cc-kit uninstall auto-compact"
"agent|$HOME/Library/LaunchAgents/io.github.dthinkr.ccw.auto-compact.plist|launchd agent. Runs compactd.py every 120 seconds.|launchctl bootout gui/\$(id -u)/io.github.dthinkr.ccw.auto-compact && rm -f the plist"
"state|$HOME/.local/state/ccw/auto-compact|state.json (per-session armed flags), compactd.log, and the agent's stdout and stderr.|rm -rf it"
"runtime|/tmp/cc-inject|One unix socket per live session that has picked up the shim, mode 600, removed when the session exits.|nothing to do, /tmp is cleared on reboot"
)
